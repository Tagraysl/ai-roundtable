<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>连接同桌 AI</title>
<style>body{font:14px "Microsoft YaHei",sans-serif;background:#f7f7f2;color:#243c37;width:330px;padding:18px}h2{margin:0 0 8px;font-size:21px}p{font-size:12px;line-height:1.7;color:#66736e}textarea,select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ced8d1;border-radius:8px;background:white;margin:6px 0;font:inherit}button{border:0;border-radius:8px;padding:11px;background:#246c58;color:white;margin:8px 3px 0 0;cursor:pointer}#status{white-space:pre-wrap;color:#805328}small{display:block;margin-top:10px;color:#64756e}</style>
<h2>同桌 AI · 网页桥</h2><p>打开 AI 网页，在桌面软件中复制连接码，粘贴到这里。每次重启桌面软件后需要更新连接码。</p>
<textarea id="code" rows="3" placeholder="粘贴桌面软件的连接码"></textarea><select id="member"></select>
<button id="connect">连接当前标签页</button><button id="disconnect">断开</button><p id="status"></p><small>只连接你指定的网页，不读取其他标签页。</small><script src="popup.js"></script></html>
