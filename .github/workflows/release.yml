name: Verify and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: python3 scripts/build-macos.py ${{ matrix.arch }}
      - name: Test packaged app
        run: |
          npm install --prefix "$RUNNER_TEMP/mac-test" playwright
          PLAYWRIGHT_PATH="$RUNNER_TEMP/mac-test/node_modules/playwright" node scripts/mac-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          path: |
            ${{ env.MAC_STAGE }}/AI-Roundtable-*.zip
            ${{ env.MAC_STAGE }}/AI-Roundtable-*.dmg
            ${{ env.MAC_STAGE }}/macOS-*-SHA256SUMS.txt
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: ./scripts/release.ps1 -Download
        shell: pwsh
      - run: node scripts/verify-release.cjs
      - name: Build EXE installer
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/release-*/*-windows-x64.zip | Select-Object -First 1
          ./scripts/build-installer.ps1 -PortableZip $zip.FullName -DownloadCompiler
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-and-source
          path: |
            dist/release-*/*.zip
            dist/release-*/SHA256SUMS.txt
            dist/installer-*/*-Setup-x64.exe
            dist/installer-*/INSTALLER-SHA256SUMS.txt
